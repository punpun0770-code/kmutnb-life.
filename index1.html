*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"K2D","Sarabun",sans-serif}
body{padding:10px}
#w{max-width:1100px;margin:auto}
.box{background:var(--pn);border:2px solid var(--bd);box-shadow:4px 4px 0 #000;padding:10px 12px}
#top{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;margin-bottom:12px}
#nm{font-size:22px;font-weight:700;color:var(--gd)}
#inc{font-size:13px;color:var(--dim)}
.sts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-family:"Press Start 2P",monospace;font-size:10px}
.s{display:flex;align-items:center;gap:5px;position:relative;cursor:help;outline:none}.s[data-tip]:hover::after,.s[data-tip]:focus::after{content:attr(data-tip);position:absolute;top:140%;left:50%;transform:translateX(-50%);background:#000;color:var(--gd);border:2px solid var(--bd);padding:4px 8px;font:13px "K2D",sans-serif;white-space:nowrap;z-index:9}.s:last-child[data-tip]:hover::after,.s:last-child[data-tip]:focus::after{left:auto;right:0;transform:none}
.b{width:46px;height:6px;background:#0a1128;border:1px solid #333}
.b i{display:block;height:100%;background:var(--gd)}
#g{display:grid;grid-template-columns:1.05fr 1fr;gap:12px}
@media(max-width:820px){#g{grid-template-columns:1fr}}
#sc{position:relative;border:3px solid var(--bd);line-height:0;box-shadow:4px 4px 0 #000}
canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block}
#pl{position:absolute;left:8px;top:8px;background:#000a;color:var(--gd);padding:4px 8px;font-size:13px;line-height:1.3}
#tl{height:10px;background:var(--pn);border:2px solid var(--bd);margin:12px 0 4px}
#tl i{display:block;height:100%;background:var(--gd);transition:width .4s}
.lb{display:flex;justify-content:space-between;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--dim)}
.meta{font-size:13px;color:var(--dim)}
h2{font-size:20px;margin:6px 0 10px;line-height:1.35}
.mny{border:2px solid var(--bd);background:#1c2340;padding:8px 12px;margin-bottom:10px;display:flex;align-items:baseline;gap:12px}
.mny b{font-family:"Press Start 2P",monospace;font-size:18px;color:var(--gd)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
button{font:inherit;font-size:16px;font-weight:700;background:var(--gd);color:#1a1a1a;border:0;border-bottom:4px solid #9a6b12;padding:10px 14px;cursor:pointer;display:block}
button:active{transform:translateY(3px);border-bottom-width:1px}
button:disabled{background:#4a4f66;color:#999;border-bottom-color:#2c2f40;cursor:not-allowed}
button.t{flex:1;background:#2a3566;color:var(--tx);border-bottom-color:#161c3a;font-size:14px}
button.t.on{background:var(--gd);color:#1a1a1a;border-bottom-color:#9a6b12}
.ch button,.lst button{width:100%;text-align:left;margin-top:7px}
.res{border:2px solid var(--bd);background:#1c2340;padding:10px;margin:8px 0;font-size:16px}
.log{color:var(--ok);font-size:14px;margin-top:6px}
.tap{font-size:26px;padding:22px;text-align:center!important;margin-top:10px;touch-action:manipulation;user-select:none}
.big{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--gd);margin:6px 0}
input{font:inherit;font-size:18px;width:100%;padding:10px;background:#0a1128;color:var(--tx);border:2px solid var(--bd);margin:8px 0}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;font-size:13px;background:#2a3566;color:var(--tx);border-bottom-color:#161c3a}
.fl{position:absolute;left:50%;top:45%;transform:translateX(-50%);font-family:"Press Start 2P",monospace;font-size:14px;color:#ffd43b;text-shadow:2px 2px 0 #000;animation:up 1.2s steps(8) forwards;pointer-events:none;white-space:nowrap;line-height:1.3}
@keyframes up{to{top:8%;opacity:0}}
#pn>*{animation:inn .25s steps(4)}
@keyframes inn{from{opacity:0;transform:translateY(6px)}}
button:hover:not(:disabled){filter:brightness(1.15)}
.lbr{display:flex;gap:8px;padding:7px 2px;border-bottom:1px dashed #334;align-items:center}
.lbr b{width:30px}.lbr span{flex:1}.lbr em{font-style:normal;color:var(--gd);font-family:"Press Start 2P",monospace;font-size:10px}
.sch{font-size:12px;color:var(--dim)}
</style>
</head>

const IC={k:'📚',s:'🛠️',h:'😄',f:'🤝',m:'🪙'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pop(t){if(!t)return;const d=document.createElement('div');d.className='fl';d.textContent=t;$('sc').appendChild(d);setTimeout(()=>d.remove(),1300)}
const getLB=()=>{try{return JSON.parse(localStorage.getItem('kmutnb_lb')||'[]')}catch(e){return[]}};
function save(t){const L=getLB();L.push({n:name,s:sch,m:M,t});L.sort((a,b)=>b.m-a.m);try{localStorage.setItem('kmutnb_lb',JSON.stringify(L.slice(0,50)))}catch(e){}return L.findIndex(e=>e.n===name&&e.m===M&&e.t===t)+1}
function fin(){endH();rank=save(lastT);tab='end';ren()}
function showLB(){if(tab!=='lb')lbBack=tab;cf=0;tab='lb';ren()}
function lbH(){const L=getLB();return`<div class="meta">คนหาเงินเก่งที่สุด</div><h2>🏆 อันดับ Top 10</h2>${L.length?L.slice(0,10).map((e,i)=>`<div class="lbr"><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>${esc(e.n)}<br><small class="sch">${esc(e.s||'-')} · ${esc(e.t)}</small></span><em>฿${pad(e.m)}</em></div>`).join(''):'<div class="res">ยังไม่มีใครเล่นจบ มาเป็นคนแรกเลย!</div>'}<div class="row"><button onclick="tab=lbBack;ren()">⬅ กลับ</button><button id="clr" onclick="clr()">ล้างอันดับ</button></div>`}
function clr(){if(!cf){cf=1;$('clr').textContent='แตะอีกครั้งเพื่อยืนยัน';return}try{localStorage.removeItem('kmutnb_lb')}catch(e){}cf=0;ren()}
const MJ={mech:{n:'เครื่องกล',ic:'⚙️',c:'กลศาสตร์และการเขียนแบบ',w:'การกลึงและประกอบเครื่องยนต์',p:'แขนกลยกของอัตโนมัติ',a:'วิศวกรเครื่องกลสายลุย ⚙️',b:'ช่างเครื่องกลมือทอง 🔧'},elec:{n:'ไฟฟ้า',ic:'⚡',c:'วงจรไฟฟ้าและกฎของโอห์ม',w:'การต่อวงจรและเดินสายไฟ',p:'ระบบไฟอัจฉริยะประหยัดพลังงาน',a:'วิศวกรไฟฟ้ามือโปร ⚡',b:'ช่างไฟฟ้ามือโปร ⚡'},civil:{n:'โยธา',ic:'🏗️',c:'โครงสร้างและการสำรวจ',w:'การผูกเหล็กและทดลองเทปูน',p:'โมเดลสะพานรับน้ำหนัก',a:'วิศวกรโยธาผู้สร้างเมือง 🏗️',b:'โฟร์แมนคุมไซต์งาน 🏗️'},cyber:{n:'ไซเบอร์',ic:'🛡️',c:'ระบบเครือข่ายและความปลอดภัย',w:'การตั้งค่าเครือข่ายและเขียนโค้ด',p:'ระบบกันแฮกเกอร์และล็อกอินปลอดภัย',a:'วิศวกรไซเบอร์สายลุย 🛡️',b:'ผู้เชี่ยวชาญความปลอดภัยระบบ 💻'}};
const rp=t=>String(t).replace(/\{(\w+)\}/g,(m,k)=>(MJ[major]&&MJ[major][k])||m);
home();
